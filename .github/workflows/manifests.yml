name: Kubernetes Manifests

on:
  push:
    branches: ["main"]
    paths:
      - "k8s/**"
      - ".github/workflows/manifests.yml"
  pull_request:
    paths:
      - "k8s/**"
      - ".github/workflows/manifests.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: "5.7.1"
  KUBECONFORM_VERSION: "0.7.0"
  # Kubernetes API version the manifests are validated against.
  KUBERNETES_VERSION: "1.31.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Downloaded to a file rather than piped into tar: a reset mid-stream (which
      # these GitHub release URLs do throw) would otherwise hand tar a truncated
      # archive that no amount of curl retrying can undo.
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 \
            -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          kustomize version

          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 \
            -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render k8s/overlays/prod
        run: |
          kustomize build k8s/overlays/prod > rendered.yaml
          echo "::group::rendered manifests"
          cat rendered.yaml
          echo "::endgroup::"

      - name: Validate against Kubernetes schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            -verbose \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            rendered.yaml

      - name: Check for Secrets in the render
        run: |
          # Every Secret the app reads is created by hand on the cluster
          # (k8s/README.md). One in the render means a generator crept into the
          # tree and would put credentials in git.
          if grep -qE '^kind: Secret$' rendered.yaml; then
            echo "::error::rendered manifests contain a Secret"
            exit 1
          fi

      - name: Check every image reference carries an explicit tag
        run: |
          # An untagged image is never acceptable: which digest a node ends up
          # running then depends on what it already has cached.
          #
          # `:latest` is accepted only for the app's own image, built from this
          # repository's Dockerfile, which carries its commit (/commit.txt).
          # Any other image on a mutable tag is a failure.
          bad=0
          while read -r image; do
            case "$image" in
              */openfront:latest) echo "ok (app image): $image" ;;
              *:latest) echo "::error::$image uses the mutable :latest tag"; bad=1 ;;
              *:*)      echo "ok: $image" ;;
              *)        echo "::error::$image has no tag"; bad=1 ;;
            esac
          done < <(grep -oE 'image: [^ ]+' rendered.yaml | cut -d' ' -f2)
          exit $bad
